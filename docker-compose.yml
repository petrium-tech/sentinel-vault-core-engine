services:
  # =========================================================================
  # BANCO DE DADOS: POSTGRESQL
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentineldb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentineldb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # APLICATIVO: SENTINEL VAULT CORE ENGINE (API REST)
  # =========================================================================
  sentinel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-vault-core
    ports:
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentineldb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SENTINEL_CRYPTO_KEY=${SENTINEL_CRYPTO_KEY}
      - SENTINEL_JWT_SECRET=${SENTINEL_JWT_SECRET}
      - SENTINEL_JWT_EXPIRATION=${SENTINEL_JWT_EXPIRATION:-3600000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
