spring:
  application:
    name: sentinel-vault

  datasource:
    url: jdbc:postgresql://localhost:5439/sentineldb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9090

sentinel:
  security:
    crypto-key: "YTM0N2M5ZjgxYjIyYzM0ZDVkNmU3YThmOTBlYTIxY2Q="
    jwt:
      # Chave secreta de 256 bits codificada em Base64 para assinatura dos tokens
      secret: "dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1hbmQtb25lLW9mLWEta2luZC1zZWNyZXQta2V5LTI1Ni1iaXRz"
      # Tempo de validade do token em milissegundos (Ex: 3600000 ms = 1 hora)
      expiration: 3600000