spring:
  application:
    name: sentinel-vault

  datasource:
    url: jdbc:postgresql://localhost:5439/sentineldb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9090

sentinel:
  security:
    # Chave simétrica real de 256 bits (32 bytes) codificada em Base64
    crypto-key: "YTM0N2M5ZjgxYjIyYzM0ZDVkNmU3YThmOTBlYTIxY2Q="