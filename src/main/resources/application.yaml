spring:
  application:
    name: sentinel-vault

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 9090

sentinel:
  security:
    crypto-key: ${SENTINEL_CRYPTO_KEY}
    jwt:
      secret: ${SENTINEL_JWT_SECRET}
      expiration: ${SENTINEL_JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org:
      springframework:
        security: DEBUG
        oauth2: TRACE