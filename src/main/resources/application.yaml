spring:
  application:
    name: sentinel-vault

  datasource:
    url: jdbc:postgresql://localhost:5439/sentineldb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 9090

sentinel:
  security:
    # Busca no SO a chave AES. Se não achar, usa a sua chave atual como fallback local
    crypto-key: ${SENTINEL_CRYPTO_KEY:YTM0N2M5ZjgxYjIyYzM0ZDVkNmU3YThmOTBlYTIxY2Q=}
    jwt:
      # Busca no SO o segredo do JWT. Se não achar, usa o fallback local
      secret: ${SENTINEL_JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1hbmQtb25lLW9mLWEta2luZC1zZWNyZXQta2V5LTI1Ni1iaXRz}
      expiration: 3600000

# DevSecOps: Monitoramento e Observabilidade com Actuator e Micrometer
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}