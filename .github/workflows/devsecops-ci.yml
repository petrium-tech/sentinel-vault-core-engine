name: Sentinel Vault - DevSecOps Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pipeline:
    name: 🛡️ DevSecOps Quality & Security Gate
    runs-on: ubuntu-latest

    # Variáveis de ambiente isoladas para execução segura no ambiente do CI
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SENTINEL_CRYPTO_KEY: YTM0N2M5ZjgxYjIyYzM0ZDVkNmU3YThmOTBlYTIxY2Q=
      SENTINEL_JWT_SECRET: ${{ secrets.SENTINEL_JWT_SECRET || 'dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1oYXNoLWZvci1jaS10ZXN0aW5nLXB1cnBvc2VzLTI1Ni1iaXRz' }}

    steps:
      # Step 1: Resgata o código-fonte do repositório
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Setup do Java 21 com Cache do Maven
      - name: 2. Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Compilação Completa da Aplicação
      - name: 3. Compile Application
        run: mvn clean compile

      # Step 4: Suíte de Testes Unitários Isolados
      - name: 4. Run Unit Tests
        run: mvn test

      # Step 5: DevSecOps (SAST) - Análise Estática com Semgrep via Docker
      - name: 5. DevSecOps - SAST Static Code Analysis (Semgrep)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=auto

      # Step 6: DevSecOps (SCA) - Varredura de dependências vulneráveis
      - name: 6. SCA - Dependency Scan (Snyk)
        continue-on-error: true
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Step 7: DevSecOps - Secret Scanning preventivo
      - name: 7. Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

      # Step 8: Build da Imagem Docker da Aplicação
      - name: 8. Build Docker Image
        run: docker build -t sentinel-vault:latest .

      # Step 9: DevSecOps - Análise de Vulnerabilidades da Imagem Docker
      - name: 9. Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentinel-vault:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'