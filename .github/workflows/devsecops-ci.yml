name: Sentinel Vault - Core Engine DevSecOps CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: 🛡️ Compile and Verify Security
    runs-on: ubuntu-latest

    steps:
      # Step 1: Resgata o código-fonte do repositório
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Configura o ecossistema com Java 21 oficial da JDK
      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: DevSecOps - Secret Scanning preventivo contra vazamento de chaves
      - name: DevSecOps - Scan for Hardcoded Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

      # Step 4: Compilação Completa e Resolução de Dependências do Maven
      - name: Build Application Package
        run: mvn clean compile

      # Step 5: Execução Automática da Suíte de Testes Unitários Isolados
      - name: Run Automated Unit Tests
        run: mvn test

      # Step 6: DevSecOps (SAST) - Análise Estática com Semgrep procurando falhas no código Java
      - name: DevSecOps - SAST Static Code Analysis (Semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
            --config=auto \
            --fail-on-core-errors

      # Step 7: DevSecOps (SCA) - Varredura de dependências vulneráveis no pom.xml
      - name: DevSecOps - SCA Dependency Vulnerability Scan (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high