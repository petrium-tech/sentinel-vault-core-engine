name: Sentinel Vault - DevSecOps Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pipeline:
    name: 🛡️ DevSecOps Quality & Security Gate
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SENTINEL_CRYPTO_KEY: ${{ secrets.SENTINEL_CRYPTO_KEY }}
      SENTINEL_JWT_SECRET: ${{ secrets.SENTINEL_JWT_SECRET }}

    steps:
      # Step 1: Resgata o código-fonte
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Secret Scanning (TruffleHog com tag de versão fixa)
      - name: 2. Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

      # Step 3: Setup do Java 21 JDK com Cache do Maven
      - name: 3. Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 4: Compilação Limpa da Aplicação
      - name: 4. Compile Application
        run: mvn clean compile

      # Step 5: Suíte de Testes Unitários
      - name: 5. Run Automated Unit Tests
        run: mvn test

      # Step 6: SAST - Análise Estática com Semgrep via Docker (Usa o JAVA_HOME e o código compilado)
      - name: 6. DevSecOps - SAST Static Code Analysis (Semgrep)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=auto

      # Step 7.1: Instala a CLI do Snyk diretamente no runner do GitHub
      - name: 7.1 Install Snyk CLI
        uses: snyk/actions/setup@v0.4.0

      # Step 7.2: SCA - Varredura de Dependências usando a CLI do Snyk no contexto com JAVA_HOME
      - name: 7.2 SCA - Dependency Scan (Snyk CLI)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth $SNYK_TOKEN
          snyk test --severity-threshold=high

      # Step 8: Build da Imagem Docker
      - name: 8. Build Docker Image
        run: docker build -t sentinel-vault:latest .

      # Step 9: Container Security Scan (Trivy com tag de versão fixa)
      - name: 9. Container Scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'sentinel-vault:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'