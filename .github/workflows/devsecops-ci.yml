name: Sentinel Vault - DevSecOps Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pipeline:
    name: 🛡️ DevSecOps Quality & Security Gate
    runs-on: ubuntu-latest

    # Variáveis de ambiente dinâmicas alimentadas estritamente por GitHub Secrets
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SENTINEL_CRYPTO_KEY: ${{ secrets.SENTINEL_CRYPTO_KEY }}
      SENTINEL_JWT_SECRET: ${{ secrets.SENTINEL_JWT_SECRET }}

    steps:
      # Step 1: Checkout do Código-Fonte
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: DevSecOps (Secret Scanning) - TruffleHog Roda ANTES de Qualquer Build
      - name: 2. Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

      # Step 3: Setup do Java 21 JDK com Cache do Maven
      - name: 3. Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 4: Compilação Limpa da Aplicação
      - name: 4. Compile Application
        run: mvn clean compile

      # Step 5: Suíte de Testes Unitários Isolados
      - name: 5. Run Automated Unit Tests
        run: mvn test

      # Step 6: DevSecOps (SAST) - Análise Estática com Semgrep via Docker
      - name: 6. DevSecOps - SAST Static Code Analysis (Semgrep)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=auto

      # Step 7: DevSecOps (SCA) - Varredura de Dependências com Snyk
      - name: 7. SCA - Dependency Scan (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Step 8: Build da Imagem Docker Multi-Stage
      - name: 8. Build Docker Image
        run: docker build -t sentinel-vault:latest .

      # Step 9: DevSecOps - Análise Severa de Vulnerabilidades na Imagem Docker (Trivy)
      - name: 9. Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentinel-vault:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'